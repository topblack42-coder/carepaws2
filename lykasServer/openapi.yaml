openapi: 3.1.0
info:
  title: CarePaws API
  version: 1.1.0
  description: REST + real-time API for the CarePaws pet shelter platform. Paths match what is mounted in src/server.js. Every
    mounted endpoint is listed. Entries with request/response schemas were written by hand; the rest are summary-level entries
    generated from the route files (path, method, access level, validator name). Each operation has an `x-access` field (public,
    authenticated, staff, admin, super_admin) that mirrors the route middleware. Real-time (Socket.io) events are documented
    in REALTIME.md, not here.
servers:
- url: http://localhost:5000
  description: Local development
security:
- bearerAuth: []
tags:
- name: System
- name: Authentication
- name: Pets
- name: Applications
- name: Risk assessments
- name: Payments
- name: Chat
- name: Volunteers
- name: Foster
- name: Events
- name: Notifications
- name: Interviews
- name: Home visits
- name: Goods donations
- name: Inventory
- name: Emergency reports
- name: Medical records
- name: Dashboard
- name: Analytics
- name: Adopter profiles
- name: Adoption pickups
- name: Announcements
- name: API keys
- name: API monitoring
- name: Volunteer shifts
- name: Audit logs
- name: Baby book
- name: Backups
- name: Content
- name: Duplicates
- name: Email templates
- name: Error log
- name: Event assignments
- name: Feature flags
- name: Feedback
- name: Files
- name: Migrations
- name: Monitoring reports
- name: Notes
- name: Reports
- name: Roles
- name: Scheduled jobs
- name: Settings
- name: Shelter care
- name: Shelters
- name: Documents
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
    ValidationError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer
    Pet:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        species:
          type: string
          enum:
          - Dog
          - Cat
          - Other
        breed:
          type: string
        age:
          type: number
        gender:
          type: string
          enum:
          - Male
          - Female
        size:
          type: string
          enum:
          - Small
          - Medium
          - Large
        temperament:
          type: string
          enum:
          - Calm
          - Playful
          - Shy
          - Energetic
          - Affectionate
          - Independent
        energyLevel:
          type: string
          enum:
          - Low
          - Medium
          - High
        status:
          type: string
          enum:
          - Available
          - Pending
          - Adopted
          - Foster
        imageUrl:
          type: string
        video:
          nullable: true
          description: Optional introduction video. Always present; null when the pet has none.
          allOf:
          - $ref: '#/components/schemas/PetVideo'
    PetVideo:
      type: object
      properties:
        url:
          type: string
          description: HTTPS delivery URL (MP4)
        thumbnailUrl:
          type: string
          nullable: true
          description: First-frame JPEG
        publicId:
          type: string
        duration:
          type: number
          nullable: true
          description: Seconds
        mimeType:
          type: string
          example: video/mp4
        size:
          type: number
          nullable: true
          description: Bytes
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        uploadedAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - user
          - staff
          - admin
          - super_admin
        status:
          type: string
          enum:
          - active
          - suspended
          - locked
paths:
  /health:
    get:
      summary: Liveness check (unversioned, public)
      responses:
        '200':
          description: OK
      tags:
      - System
      x-access: public
  /api/auth/register:
    post:
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - displayName
              - email
              - password
              properties:
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Account created
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email already registered
      security: []
      tags:
      - Authentication
      x-access: public
  /api/auth/login:
    post:
      summary: Log in with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in
        '401':
          description: Invalid credentials
        '423':
          description: Account temporarily locked (5 failed attempts)
      security: []
      tags:
      - Authentication
      x-access: public
  /api/auth/refresh:
    post:
      summary: Rotate a refresh token for a new access/refresh pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New token pair issued
        '401':
          description: Invalid or expired refresh token
      security: []
      tags:
      - Authentication
      x-access: public
  /api/auth/me:
    get:
      summary: Get the current authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
      tags:
      - Authentication
      x-access: authenticated
  /api/pets:
    get:
      summary: Public pet catalog (list, filterable, paginated)
      security: []
      parameters:
      - in: query
        name: species
        schema:
          type: string
          enum:
          - Dog
          - Cat
          - Other
      - in: query
        name: status
        schema:
          type: string
          enum:
          - Available
          - Pending
          - Adopted
          - Foster
      - in: query
        name: q
        schema:
          type: string
        description: Free-text search across name/breed/description
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Paginated pet list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pet'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
      tags:
      - Pets
      x-access: public
    post:
      summary: Create a pet (staff/admin/super_admin, multipart; image and video are both optional)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                video:
                  type: string
                  format: binary
                  description: Optional MP4 (H.264). Defaults - 25 MB, 60 s (PET_VIDEO_MAX_SIZE_MB / PET_VIDEO_MAX_DURATION_SECONDS).
                name:
                  type: string
                species:
                  type: string
                  enum:
                  - Dog
                  - Cat
                  - Other
      responses:
        '201':
          description: Pet created (video is null when none was sent)
        '400':
          description: Validation failed or unexpected upload field
        '403':
          description: Insufficient role
        '413':
          description: Video (or image) over the size limit
        '415':
          description: Not a valid MP4 / unsupported media type
        '422':
          description: Video too long, unsupported codec, or could not be processed
        '502':
          description: Video storage unavailable - retry
        '504':
          description: Video upload timed out - retry
      tags:
      - Pets
      x-access: staff
  /api/pets/{id}:
    get:
      summary: Get a single pet (includes `video`, or null)
      security: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pet
        '404':
          description: Not found
      tags:
      - Pets
      x-access: public
    put:
      summary: Update a pet (staff). Sending a `video` file adds or replaces the video; omitting it leaves the current video
        untouched.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated pet. The old video file is deleted only after the new one is saved.
        '404':
          description: Not found
        '413':
          description: File over the size limit
        '415':
          description: Not a valid MP4 / unsupported media type
        '422':
          description: Video too long, unsupported codec, or could not be processed
        '502':
          description: Video storage unavailable - existing video is kept
      tags:
      - Pets
      x-access: staff
    delete:
      tags:
      - Pets
      summary: Delete pet
      description: "**Access:** Staff, admin or super_admin.  \nSummary-level entry generated from the route definition: exact\
        \ response fields are in the controller."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        2XX:
          description: Success. Standard envelope `{ success, message?, data? }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role or email not verified
        '404':
          description: Not found
      x-access: staff
  /api/pets/{id}/video:
    delete:
      summary: Remove a pet's video (staff). Explicit and idempotent; the pet, photo and all other data are untouched.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pet with video null
        '400':
          description: Malformed id
        '403':
          description: Insufficient role
        '404':
          description: Pet not found
      tags:
      - Pets
      x-access: staff
  /api/applications:
    post:
      summary: Submit an adoption/foster application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pet
              - phone
              - address
              properties:
                pet:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                type:
                  type: string
                  enum:
                  - adoption
                  - foster
      responses:
        '201':
          description: Application submitted
        '409':
          description: Pet not currently available
      tags:
      - Applications
      x-access: authenticated
    get:
      summary: List applications (staff)
      responses:
        '200':
          description: Paginated application list
      tags:
      - Applications
      x-access: staff
  /api/applications/{id}/status:
    put:
      summary: Approve or reject an application (staff)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - pending
                  - approved
                  - rejected
      responses:
        '200':
          description: Updated
      tags:
      - Applications
      x-access: staff
  /api/risk-assessments:
    post:
      summary: Create a risk assessment (staff) — totalScore/riskLevel are always server-computed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - application
              - pet
              - applicant
              - scores
              properties:
                application:
                  type: string
                pet:
                  type: string
                applicant:
                  type: string
                scores:
                  type: object
                  properties:
                    housingStability:
                      type: integer
                      minimum: 1
                      maximum: 5
                    financialReadiness:
                      type: integer
                      minimum: 1
                      maximum: 5
                    petExperience:
                      type: integer
                      minimum: 1
                      maximum: 5
                    lifestyleMatch:
                      type: integer
                      minimum: 1
                      maximum: 5
                    familyCommitment:
                      type: integer
                      minimum: 1
                      maximum: 5
                    knowledgeOfPet:
                      type: integer
                      minimum: 1
                      maximum: 5
      responses:
        '201':
          description: Created — riskLevel computed server-side (Low >= 24, Medium >= 15, else High)
      tags:
      - Risk assessments
      x-access: staff
    get:
      tags:
      - Risk assessments
      summary: List
      description: "**Access:** Staff, admin or super_admin.  \nSummary-level entry generated from the route definition: exact\
        \ response fields are in the controller."
      responses:
        2XX:
          description: Success. Standard envelope `{ success, message?, data? }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient role or email not verified
      x-access: staff
  /api/payments/create-checkout:
    post:
      summary: Create a PayMongo checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - amount
              - description
              properties:
                type:
                  type: string
                  enum:
                  - donation
                  - adoption_fee
                  - event_fee
                amount:
                  type: integer
                  description: PHP centavos
                description:
                  type: string
      responses:
        '201':
          description: Checkout session created, includes paymongoCheckoutUrl
        '503':
          description: Payment gateway not configured
      tags:
      - Payments
      x-access: authenticated
  /api/payments/webhook:
    post:
      summary: PayMongo webhook (gateway -> server, no JWT — verified by signature)
      security: []
      responses:
        '200':
          description: Acknowledged
        '401':
          description: Invalid webhook signature
      tags:
      - Payments
      x-access: public
  /api/messages/{userId}:
    get:
      summary: Chat history for a conversation (owner or staff)
      parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Message history, oldest-first
        '403':
          description: Not authorized
      tags:
      - Chat
      x-access: authenticated
  /api/chat-sessions:
    get:
      summary: List conversations, most-recent-first (staff only)
      responses:
        '200':
          description: Conversation list
      tags:
      - Chat
      x-access: staff
  /api/auth/users:
    get:
      summary: List all user accounts (admin), with search/filter/pagination
      parameters:
      - in: query
        name: q
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - user
          - staff
          - admin
          - super_admin
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - suspended
          - locked
      responses:
        '200':
          description: Paginated user list
      tags:
      - Authentication
      x-access: staff
  /api/auth/users/{id}/role:
    put:
      summary: Change a user's role (super_admin only)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - role
              properties:
                role:
                  type: string
                  enum:
                  - user
                  - staff
                  - admin
                  - super_admin
      responses:
        '200':
          description: Role updated
      tags:
      - Authentication
      x-access: super_admin
  /api/auth/users/{id}/status:
    put:
      summary: Suspend, lock, or reactivate a user account (admin)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - active
                  - suspended
                  - locked
      responses:
        '200':
          description: Status updated — suspending also revokes all active sessions
      tags:
      - Authentication
      x-access: staff
  /api/volunteers/register:
    post:
      summary: Submit a volunteer application (self-service)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              - address
              properties:
                phone:
                  type: string
                address:
                  type: string
                motivation:
                  type: string
                availability:
                  type: array
                  items:
                    type: string
                    enum:
                    - Weekday mornings
                    - Weekday afternoons
                    - Weekends
                    - Flexible
      responses:
        '201':
          description: Application submitted, status starts as "pending"
        '409':
          description: Applicant already has a volunteer application on file
      tags:
      - Volunteers
      x-access: authenticated
  /api/volunteers/{id}/status:
    put:
      summary: Approve or reject a volunteer application (staff)
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - pending
                  - approved
                  - rejected
                  - inactive
      responses:
        '200':
          description: Updated
      tags:
      - Volunteers
      x-access: staff
  /api/foster:
    post:
      summary: Assign a pet to a foster (staff) — also sets the pet's status to Foster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pet
              - fosterer
              - startDate
              properties:
                pet:
                  type: string
                fosterer:
                  type: string
                startDate:
                  type: string
                  format: date
                weeklyReportsRequired:
                  type: integer
      responses:
        '201':
          description: Foster placement created
      tags:
      - Foster
      x-access: staff
    get:
      summary: List all foster placements (staff)
      responses:
        '200':
          description: Foster placement list
      tags:
      - Foster
      x-access: staff
  /api/foster/{id}/end:
    put:
      summary: End a foster placement (staff) — sets pet status based on outcome
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - outcome
              properties:
                outcome:
                  type: string
                  enum:
                  - ADOPTED
                  - RETURNED
                  - EXTENDED
      responses:
        '200':
          description: Placement ended. ADOPTED -> pet becomes Adopted; RETURNED/EXTENDED -> pet becomes Available.
      tags:
      - Foster
      x-access: staff
  /api/foster/{fosterId}/reports:
    post:
      summary: Submit a weekly foster report
      parameters:
      - in: path
        name: fosterId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - weekNumber
              properties:
                weekNumber:
                  type: integer
                overallProgress:
                  type: string
                  enum:
                  - Excellent
                  - Good
                  - Fair
                  - Needs Attention
      responses:
        '201':
          description: Report recorded, increments the foster's weeklyReportsSubmitted counter
      tags:
      - Foster
      x-access: authenticated
    get:
      tags:
      - Foster
      summary: List reports
      description: "**Access:** Any logged-in user. The handler may apply ownership checks.  \nSummary-level entry generated\
        \ from the route definition: exact response fields are in the controller."
      parameters:
      - name: fosterId
        in: path
        required: true
        schema:
          type: string
      responses:
        2XX:
          description: Success. Standard envelope `{ success, message?, data? }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
        '404':
          description: Not found
      x-access: authenticated
  /api/events:
    get:
      summary: List events (public)
      security: []
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - upcoming
          - ongoing
          - completed
          - cancelled
      responses:
        '200':
          description: Event list
      tags:
      - Events
      x-access: public
    post:
      summary: Create an event (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - category
              - date
              properties:
                title:
                  type: string
                category:
                  type: string
                  enum:
                  - Adoption Drive
                  - Fundraiser
                  - Training
                  - Community
                  - Volunteer
                  - Other
                date:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Event created
      tags:
      - Events
      x-access: staff
  /api/events/{id}/register:
    post:
      summary: Register for an event
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Registered
        '409':
          description: Event is full, or already registered
      tags:
      - Events
      x-access: authenticated
    delete:
      tags:
      - Events
      summary: Unregister
      description: "**Access:** Any logged-in user. The handler may apply ownership checks.  \nSummary-level entry generated\
        \ from the route definition: exact response fields are in the controller."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        2XX:
          description: Success. Standard envelope `{ success, message?, data? }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
        '404':
          description: Not found
      x-access: authenticated
  /api/notifications/my:
    get:
      summary: The current user's notifications, newest-first
      responses:
        '200':
          description: Notification list
      tags:
      - Notifications
      x-access: authenticated
  /api/notifications/unread-count:
    get:
      summary: Unread notification count for the current user
      responses:
        '200':
          description: '{ count: number }'
      tags:
      - Notifications
      x-access: authenticated
  /api/interviews:
    post:
      summary: Schedule an adoption interview (staff)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - application
              - applicant
              - pet
              - scheduledDate
              - method
              properties:
                method:
                  type: string
                  enum:
                  - In-person
                  - Video call
                  - Phone call
      responses:
        '201':
          description: Interview scheduled, applicant is notified
      tags:
      - Interviews
      x-access: staff
    get:
      tags:
      - Interviews
      summary: List
      description: "**Access:** Staff, admin or super_admin.  \nSummary-level entry generated from the route definition: exact\
        \ response fields are in the controller."
      responses:
